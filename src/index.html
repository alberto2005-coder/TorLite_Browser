<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Antigravity Onion Browser</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div class="tab-bar" id="tab-bar">
      <div class="tabs-container" id="tabs-container"></div>
      <button class="new-tab-btn" id="new-tab-btn" title="New Tab">+</button>
    </div>

    <div class="control-bar">
      <div class="nav-buttons">
        <button id="back-btn" title="Back" class="nav-btn">
          <svg viewBox="0 0 24 24"><path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z"/></svg>
        </button>
        <button id="forward-btn" title="Forward" class="nav-btn">
          <svg viewBox="0 0 24 24"><path d="M4,11V13H16L10.5,18.5L11.92,19.92L19.84,12L11.92,4.08L10.5,5.5L16,11H4Z"/></svg>
        </button>
        <button id="reload-btn" title="Reload" class="nav-btn">
          <svg viewBox="0 0 24 24"><path d="M17.65,6.35C16.2,4.9 14.21,4 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20C15.73,20 18.84,17.45 19.73,14H17.65C16.83,16.33 14.61,18 12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6C13.66,6 15.14,6.69 16.22,7.78L13,11H20V4L17.65,6.35Z"/></svg>
        </button>
        <button id="home-btn" title="Home" class="nav-btn">
          <svg viewBox="0 0 24 24"><path d="M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z"/></svg>
        </button>
      </div>

      <div class="address-bar-container">
        <span class="onion-icon" id="onion-badge">🧅</span>
        <input type="text" id="url-input" placeholder="Search or enter onion address..." autocomplete="off" />
      </div>

      <div class="status-container" id="status-container" title="Tor connection status">
        <div class="status-indicator connecting" id="status-dot"></div>
        <span class="status-text" id="status-text">Bootstrapping Tor...</span>
      </div>
    </div>
  </body>
</html>
